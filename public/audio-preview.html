<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>음성 파일 미리듣기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f7; color: #111; padding: 24px 24px 120px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 20px; }
  .pack-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .pack-tab { padding: 8px 20px; border-radius: 20px; border: 1.5px solid #ddd; background: white; cursor: pointer; font-size: 14px; font-weight: 600; }
  .pack-tab.active { background: #2F6BFF; color: white; border-color: #2F6BFF; }
  .section { background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); transition: box-shadow 0.2s; }
  .section.passed { box-shadow: 0 0 0 2px #34c759, 0 1px 4px rgba(0,0,0,0.07); }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 13px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
  .pass-btn { padding: 5px 14px; border-radius: 20px; border: 1.5px solid #34c759; background: white; color: #34c759; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .pass-btn:hover { background: #f0fff4; }
  .pass-btn.active { background: #34c759; color: white; }
  .pass-badge { display: none; font-size: 12px; font-weight: 700; color: #34c759; margin-left: 8px; }
  .section.passed .pass-badge { display: inline; }
  .section.passed .section-title { color: #34c759; }
  .file-grid { display: flex; flex-direction: column; gap: 4px; }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; transition: background 0.1s; cursor: pointer; }
  .file-row:hover { background: #f0f4ff; }
  .file-row.checked { background: #fff3f3; }
  .play-btn { width: 32px; height: 32px; border-radius: 50%; background: #2F6BFF; border: none; cursor: pointer; color: white; font-size: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .play-btn:hover { background: #1a55e0; }
  .play-btn.playing { background: #ff4444; }
  .file-name { font-size: 13px; font-weight: 600; color: #333; min-width: 190px; }
  .file-text { font-size: 13px; color: #666; flex: 1; }
  .exist-status { font-size: 11px; width: 60px; text-align: right; flex-shrink: 0; }
  .cb { width: 18px; height: 18px; accent-color: #ff3b30; cursor: pointer; flex-shrink: 0; }

  /* 하단 고정 패널 */
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; padding: 16px 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
  .bottom-inner { max-width: 900px; margin: 0 auto; }
  .bottom-info { font-size: 13px; color: #666; margin-bottom: 10px; }
  .bottom-info strong { color: #ff3b30; }
  .cmd-box { background: #1e1e1e; color: #d4f8a0; font-family: 'SF Mono', monospace; font-size: 12px; border-radius: 10px; padding: 12px 16px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; margin-bottom: 10px; display: none; }
  .bottom-btns { display: flex; gap: 8px; }
  .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-show  { background: #ff3b30; color: white; }
  .btn-copy  { background: #2F6BFF; color: white; }
  .btn-run   { background: #ff9500; color: white; }
  .btn-clear { background: #f0f0f0; color: #555; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .copied { background: #34c759 !important; }
  .log-box { background: #1e1e1e; color: #d4f8a0; font-family: 'SF Mono', monospace; font-size: 12px; border-radius: 10px; padding: 12px 16px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; margin-bottom: 10px; display: none; }

  .voice-selector label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: 600; }
  .voice-selector input[type=checkbox] { width: 16px; height: 16px; accent-color: #2F6BFF; cursor: pointer; }
  .api-count { font-size: 12px; color: #ff9500; font-weight: 700; }

<div class="pack-tabs">
  <button class="pack-tab active" onclick="setPack('default', this)">★ 유료 프리미엄 여성 (default)</button>

    </div>

    <div class="log-box" id="log-box"></div>
    <div class="bottom-btns">
      <button class="btn btn-run" id="btn-run" onclick="runDirect()" disabled>▶ 직접 실행</button>
      <button class="btn btn-show" id="btn-show" onclick="showCmd()" disabled>명령어 생성</button>
      <button class="btn btn-copy" id="btn-copy" onclick="copyCmd()" disabled>클립보드 복사</button>

    btn.classList.remove('active')

    sectionEl.classList.add('passed')
    btn.textContent = '✅ 통과'
    btn.classList.add('active')

function setPack(pack, tabEl) {
  currentPack = pack
  document.querySelectorAll('.pack-tab').forEach(t => t.classList.remove('active'))
  tabEl.classList.add('active')
  stopAudio()
  render()
}

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null }
  if (currentBtn) { currentBtn.textContent = '▶'; currentBtn.classList.remove('playing'); currentBtn = null }
}

function play(btn, path, e) {
  e.stopPropagation()
  if (currentAudio) {
    currentAudio.pause(); currentAudio = null
    const wasBtn = currentBtn
    currentBtn.textContent = '▶'; currentBtn.classList.remove('playing'); currentBtn = null
    if (wasBtn === btn) return
  }
  const audio = new Audio(path)
  audio.onended = () => { btn.textContent = '▶'; btn.classList.remove('playing'); currentAudio = null; currentBtn = null }
  audio.onerror = () => { btn.textContent = '✕'; btn.style.background = '#ccc'; currentAudio = null; currentBtn = null }
  audio.play().catch(() => {})
  currentAudio = audio; currentBtn = btn
  btn.textContent = '■'; btn.classList.add('playing')
}

function toggleCheck(name, row, cb) {
  if (checked.has(name)) {
    checked.delete(name)
    row.classList.remove('checked')
    cb.checked = false
  } else {
    checked.add(name)
    row.classList.add('checked')
    cb.checked = true
  }
  updateBottom()
}

function getSelectedVoices() {
  const voices = []
  if (document.getElementById('vc-default')?.checked) voices.push('default')
  if (document.getElementById('vc-energy')?.checked)  voices.push('energy')
  return voices.length ? voices : ['default']
}

function updateBottom() {
  const count = checked.size
  const voices = getSelectedVoices()
  const apiCalls = count * voices.length
  const info = document.getElementById('bottom-info')
  const btnShow = document.getElementById('btn-show')
  const btnCopy = document.getElementById('btn-copy')
  const cmdBox = document.getElementById('cmd-box')
  const apiCount = document.getElementById('api-count')

  if (count === 0) {
    info.innerHTML = '선택된 파일 없음 — 재생성할 파일을 체크하세요'
    if (apiCount) apiCount.textContent = ''
    btnShow.disabled = true
    btnCopy.disabled = true
    cmdBox.style.display = 'none'
    document.getElementById('btn-run').disabled = true
  } else {
    info.innerHTML = `<strong>${count}개</strong> 선택됨 — ▶ 직접 실행 또는 명령어 복사`
    if (apiCount) apiCount.textContent = `API 호출 ${apiCalls}회 예상`
    btnShow.disabled = false
    document.getElementById('btn-run').disabled = false
  }
}

function showCmd() {
  const names = [...checked]
  const voices = getSelectedVoices()
  const rmLines = []
  for (const n of names) {
    for (const v of voices) rmLines.push(`rm -f public/audio/${v}/${n}.wav`)
  }
  const genLines = voices.map(v => `node generate_audio.cjs ${v} select ${names.join(',')}`)
  const cmd = [
    '# 선택한 파일 삭제',
    ...rmLines,
    '',
    '# 선택 파일만 재생성 (select 모드 — API 호출 최소화)',
    ...genLines,
  ].join('\n')

  const box = document.getElementById('cmd-box')
  box.textContent = cmd
  box.style.display = 'block'
  document.getElementById('btn-copy').disabled = false
}

function copyCmd() {
  const text = document.getElementById('cmd-box').textContent
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy')
    btn.textContent = '✅ 복사됨!'
    btn.classList.add('copied')
    setTimeout(() => { btn.textContent = '클립보드 복사'; btn.classList.remove('copied') }, 2000)
  })
}

async function runDirect() {
  const names = [...checked]
  const btn = document.getElementById('btn-run')
  const logBox = document.getElementById('log-box')
  logBox.textContent = ''
  logBox.style.display = 'block'
  btn.disabled = true
  btn.textContent = '⏳ 실행 중...'

  const log = (msg) => {
    logBox.textContent += msg + '\n'
    logBox.scrollTop = logBox.scrollHeight
  }

  try {
    const voices = getSelectedVoices()
    const res = await fetch('http://localhost:3456/delete-and-generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: names, voices }),
    })
    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const parts = buf.split('\n\n')
      buf = parts.pop()
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim()
        if (!line) continue
        try {
          const { msg } = JSON.parse(line)
          if (msg === '__DONE__') {
            log('\n✅ 모두 완료! 페이지 새로고침하면 새 파일로 재생됩니다.')
            btn.textContent = '✅ 완료 — 새로고침'
            btn.style.background = '#34c759'
            btn.disabled = false
            btn.onclick = () => location.reload()
            clearAll()
            return
          }
          log(msg)
        } catch {}
      }
    }
  } catch (e) {
    log(`❌ 서버 연결 실패: http://localhost:3456`)
    log(`   터미널에서 먼저 실행하세요: node audio-server.cjs`)
    btn.textContent = '▶ 직접 실행'
    btn.disabled = false
  }
}

function clearAll() {
  checked.clear()
  document.querySelectorAll('.file-row.checked').forEach(r => r.classList.remove('checked'))
  document.querySelectorAll('.cb').forEach(c => c.checked = false)
  document.getElementById('cmd-box').style.display = 'none'
  document.getElementById('btn-copy').disabled = true
  updateBottom()
}

function render() {
  const container = document.getElementById('content')
  container.innerHTML = ''
  sections.forEach(sec => {
    const div = document.createElement('div')
    const secKey = `${currentPack}__${sec.title}`
    const isPassed = passedSections.has(secKey)
    div.className = 'section' + (isPassed ? ' passed' : '')
    div.innerHTML = `
      <div class="section-header">
        <span class="section-title">${sec.title}<span class="pass-badge">✅ 통과</span></span>
        <div style="display:flex;align-items:center;gap:10px">
          <label style="font-size:12px;color:#aaa;cursor:pointer;display:flex;align-items:center;gap:4px">
            <input type="checkbox" onchange="toggleSection(this, ${JSON.stringify(sec.files.map(f=>f.name))})"> 전체선택
          </label>
          <button class="pass-btn ${isPassed ? 'active' : ''}" onclick="togglePass('${secKey}', this.closest('.section'), this)">
            ${isPassed ? '✅ 통과' : '통과'}
          </button>
        </div>
      </div>
      <div class="file-grid"></div>`
    const grid = div.querySelector('.file-grid')

    sec.files.forEach(f => {
      const path = `/audio/${currentPack}/${f.name}.wav`
      const isChecked = checked.has(f.name)
      const row = document.createElement('div')
      row.className = 'file-row' + (isChecked ? ' checked' : '')
      row.innerHTML = `
        <input type="checkbox" class="cb" ${isChecked ? 'checked' : ''} onclick="toggleCheck('${f.name}', this.closest('.file-row'), this)">
        <button class="play-btn" onclick="play(this, '${path}', event)">▶</button>
        <span class="file-name">${f.name}</span>
        <span class="file-text">${f.text}</span>
        <span class="exist-status" id="s_${f.name}">…</span>
      `
      row.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return
        const cb = row.querySelector('.cb')
        toggleCheck(f.name, row, cb)
      })
      grid.appendChild(row)

      const a = new Audio()
      a.src = path
      a.oncanplaythrough = () => {
        const el = document.getElementById(`s_${f.name}`)
        if (el) { el.textContent = '✅'; el.style.color = '#34c759' }
      }
      a.onerror = () => {
        const el = document.getElementById(`s_${f.name}`)
        if (el) { el.textContent = '❌'; el.style.color = '#ff3b30' }
      }
    })
    container.appendChild(div)
  })
}

function toggleSection(masterCb, names) {
  names.forEach(name => {
    const row = document.querySelector(`.file-row:has(#s_${name})`)
    const cb = row?.querySelector('.cb')
    if (!cb) return
    if (masterCb.checked) {
      checked.add(name); row.classList.add('checked'); cb.checked = true
    } else {
      checked.delete(name); row.classList.remove('checked'); cb.checked = false
    }
  })
  updateBottom()
}

render()
</script>
</body>
</html>
